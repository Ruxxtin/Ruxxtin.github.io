      window._isMobile =
        /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) &&
        window.matchMedia("(max-width: 768px)").matches;
    </script>

    <script data-cfasync="false">
      var isNewWindow = false;
      var hasVideoPreview = false;
      var isFullscreenMode = false;

      var gamePlayParams = {
        game_id: "five-nights-at-winston-s",
        game_category: "",
        source: "external",
      };

      // Helper function to check if currently in fullscreen
      function isCurrentlyFullscreen() {
        return !!(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement
        );
      }
    </script>
    <script data-cfasync="false">
      // ===== Mobile UX state flags =====
      var _hasInteracted = false;
      var _scrollY = 0;

      function applyMobileFullscreenHeight() {
        // Only used when virtualViewport resizes (e.g. soft keyboard appears)
        // CSS 100dvh handles initial fullscreen — only override when vVP differs
        var gp = document.querySelector(".game-iframe-play");
        if (!gp) return;
        if (window.visualViewport) {
          var dvh = window.innerHeight;
          var vvh = window.visualViewport.height;
          // Only set inline if keyboard is open (vvh meaningfully smaller than dvh)
          if (dvh - vvh > 100) {
            gp.style.height = vvh + "px";
          } else {
            gp.style.height = "";
          }
        }
      }

      function resetMobileFullscreenHeight() {
        var gp = document.querySelector(".game-iframe-play");
        if (gp) gp.style.height = "";
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", function () {
          if (
            document.body.classList.contains("fullscreen") &&
            window._isMobile
          ) {
            applyMobileFullscreenHeight();
          }
        });
      }

      function exitMobileGame() {
        var gp = document.querySelector(".game-iframe-play");
        if (gp) gp.classList.remove("open_fullscreen");
        document.body.classList.remove("fullscreen");
        document.documentElement.style.overflow = "";
        resetMobileFullscreenHeight();

        // Tell embed iframe to reset back to preview state
        var embedIframe = document.getElementById("game-area");
        if (embedIframe && embedIframe.contentWindow) {
          embedIframe.contentWindow.postMessage({ type: "exit_game" }, "*");
        }

        var mobileFsBar = document.getElementById("mobile-fs-bar");
        if (mobileFsBar) mobileFsBar.classList.remove("active");
        var gp = document.querySelector(".game-iframe-play");
        if (gp) gp.classList.remove("has-fs-bar");

        window.scrollTo(0, _scrollY);
      }

      if (window._isMobile) {
        _scrollY = window.scrollY || window.pageYOffset;
      }

      if (!window._isMobile && isFullscreenMode && !isCurrentlyFullscreen()) {
        // Desktop fullscreen mode: trigger browser fullscreen after iframe loads
        var _fsIframe = document.getElementById("game-area");
        if (_fsIframe) {
          _fsIframe.addEventListener(
            "load",
            function () {
              if (this.src && this.src !== "about:blank") {
                setTimeout(function () {
                  var el = document.documentElement;
                  if (el.requestFullscreen) el.requestFullscreen();
                  else if (el.webkitRequestFullscreen)
                    el.webkitRequestFullscreen();
                }, 200);
              }
            },
            { once: true },
          );
        }
      }

      if (typeof sendEventToGA === "function") {
        sendEventToGA("game_detail_play", gamePlayParams);
      }

      document.addEventListener("DOMContentLoaded", function () {
        var mobileFsBack = document.getElementById("mobile-fs-back");
        if (mobileFsBack) {
          mobileFsBack.addEventListener("click", exitMobileGame);
        }
      });

      // postMessage + back-gesture trap
      (function () {
        var _trapped = false;

        function trapBackGesture() {
          if (_trapped) return;
          _trapped = true;
          history.replaceState({ gameActive: true }, "");
          history.pushState({ gameActive: true }, "");
          window.addEventListener("popstate", function () {
            history.pushState({ gameActive: true }, "");
          });
        }

        var embedIframe = document.getElementById("game-area");
        if (embedIframe) {
          embedIframe.addEventListener("load", function () {
            if (embedIframe.src && embedIframe.src !== "about:blank")
              trapBackGesture();
          });
        }

        var _prerollActive = false;

        function showMobileFsBar() {
          var bar = document.getElementById("mobile-fs-bar");
          if (bar) bar.classList.add("active");
          var gp = document.querySelector(".game-iframe-play");
          if (gp) gp.classList.add("has-fs-bar");
        }

        window.addEventListener("message", function (e) {
          if (
            e.data &&
            (e.data.type === "preroll_ad_break_done" ||
              e.data.type === "game_loaded")
          ) {
            trapBackGesture();
            if (window._isMobile) {
              _prerollActive = false;
              showMobileFsBar();
            }
          }
          if (e.data && e.data.type === "play_clicked" && window._isMobile) {
            _hasInteracted = true;
            _scrollY = window.scrollY || window.pageYOffset;
            var gameCode = document.getElementById("game-code");
            if (gameCode) gameCode.style.display = "block";
            var gp = document.querySelector(".game-iframe-play");
            if (gp && !gp.classList.contains("open_fullscreen")) {
              gp.classList.add("open_fullscreen");
              document.body.classList.add("fullscreen");
              document.documentElement.style.overflow = "hidden";
            }
            if (!_prerollActive) {
              showMobileFsBar();
            }
          }
        });
      })();

      // Override open_fullscreen after scripts.min.js loads to ensure #game-code stays visible
      window.addEventListener("load", function () {
        var _orig_open_fullscreen = window.open_fullscreen;
        window.open_fullscreen = function () {
          if (_orig_open_fullscreen) _orig_open_fullscreen();
          var gameCode = document.getElementById("game-code");
          if (gameCode) gameCode.style.display = "block";
        };
      });
    </script>
